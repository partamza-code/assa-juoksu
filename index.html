/* Wix / responsive edition */
html,body{
  width:100%;height:100%;margin:0;padding:0;overflow:hidden;
  background:#111;
}
body{
  display:flex;align-items:center;justify-content:center;
}
#wixStage{
  position:relative;
  width:min(100vw, calc(100vh * 4 / 3));
  height:min(100vh, calc(100vw * 3 / 4));
  overflow:hidden;
}
#wixScaler{
  position:absolute;left:0;top:0;
  width:960px;height:720px;
  transform-origin:top left;
}
#wrap{
  width:960px!important;height:540px!important;
  max-width:none!important;margin:0!important;
}
canvas{
  width:960px!important;height:540px!important;
  max-width:none!important;
  display:block;
}

#wixStage,#wixStage canvas{touch-action:none;user-select:none;-webkit-user-select:none;}

#mobileControls{
 position:absolute;left:0;bottom:0;top:auto;width:960px;height:180px;
 display:none;align-items:flex-end;justify-content:space-between;
 padding:0 8px 10px 20px;box-sizing:border-box;
 background:transparent;border:0;z-index:40;pointer-events:none
}
.mobileGroup{display:flex;gap:18px;align-items:center}
.gameTouch{
 pointer-events:auto;width:78px;height:78px;border-radius:19px;
 border:5px solid #ffe0a3;background:#984b21;color:white;
 font:900 37px/1 Arial,sans-serif;box-shadow:0 8px 0 #4b2a1b;
 touch-action:none
}
#jumpTouch{
 width:118px;height:78px;font-size:21px;margin-left:auto;margin-right:0
}
#jossesTouch{display:none}
#deathJosses{display:none;position:absolute;z-index:100;left:50%;top:50%;transform:translate(-50%,-50%);width:300px;height:105px;border-radius:24px;border:6px solid #ffe0a3;background:#d92c22;color:white;font:900 38px/1 Arial,sans-serif;box-shadow:0 9px 0 #4b1d15;touch-action:none}

<style id="wix-transparent-outer">
html,body{background:transparent!important;}
</style>

<style id="v22-responsive-mobile-controls">
/* Ohjaimet skaalautuvat stage-elementin mukana, eivät selaimen/Wixin viewportin mukaan. */
#mobileControls{
  position:absolute!important;
  left:0!important; right:0!important; bottom:0!important; top:auto!important;
  width:100%!important; height:180px!important;
  padding:0 18px 12px 18px!important;
  box-sizing:border-box!important;
  display:none;
  align-items:flex-end!important;
  justify-content:space-between!important;
  background:transparent!important;
  pointer-events:none!important;
}
#mobileControls .gameTouch{
  pointer-events:auto!important;
  width:78px!important; height:78px!important;
  min-width:78px!important; min-height:78px!important;
  padding:0!important; margin:0!important;
  border-radius:19px!important;
  border:5px solid #ffe0a3!important;
  background:#984b21!important;
  color:#fff!important;
  box-shadow:0 8px 0 #4b2a1b!important;
  font:900 37px/1 Arial,sans-serif!important;
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  box-sizing:border-box!important;
  touch-action:none!important;
  -webkit-appearance:none!important;
  appearance:none!important;
}
#mobileControls #jumpTouch{
  width:118px!important; height:78px!important;
  min-width:118px!important; min-height:78px!important;
  margin-left:auto!important; margin-right:0!important;
  font-size:21px!important;
}
/* Pienillä Wix-mobiilinäkymillä hieman kompaktimpi mutta samassa suhteessa. */
@media (max-width:600px){
  #mobileControls{padding:0 14px 10px 14px!important;}
  #mobileControls .gameTouch{
    width:72px!important;height:72px!important;
    min-width:72px!important;min-height:72px!important;
    border-width:4px!important;font-size:34px!important;
    box-shadow:0 7px 0 #4b2a1b!important;
  }
  #mobileControls #jumpTouch{
    width:104px!important;height:72px!important;
    min-width:104px!important;min-height:72px!important;
    font-size:18px!important;
  }
}
</style>

<style id="v27-portrait-controls-fix">
/* Pystyasennossa peli skaalautuu leveyden mukaan, joten ohjainten
   sisäiset mitat pienennetään erikseen. Vaakatilaan ei kosketa. */
@media (orientation: portrait) and (max-width: 800px){
  #mobileControls{
    padding:0 22px 12px 22px!important;
  }
  #mobileControls .gameTouch{
    width:48px!important;
    height:48px!important;
    min-width:48px!important;
    min-height:48px!important;
    border-width:3px!important;
    border-radius:13px!important;
    font-size:23px!important;
    box-shadow:0 5px 0 #4b2a1b!important;
  }
  #mobileControls #jumpTouch{
    width:78px!important;
    height:48px!important;
    min-width:78px!important;
    min-height:48px!important;
    font-size:13px!important;
    border-width:3px!important;
    border-radius:13px!important;
    box-shadow:0 5px 0 #4b2a1b!important;
  }
}
</style>

<style id="v28-hide-old-canvas-controls">
@media (max-width: 800px){
  /* Peitetään canvasin vanhojen mustien nuolipainikkeiden alue
     varsinaisilla kosketusohjaimilla ilman että pelimekaniikka muuttuu. */
  #mobileControls{z-index:100!important;}
}
</style>

<style id="v29-mobile-cleanup">
/* Uudet ruskeat kosketusohjaimet ovat ainoat mobiiliohjaimet. */
#touchControls,#oldControls,#controlsLegacy,.legacyControls,.oldControls{display:none!important;}

/* JÖSSES pienemmäksi mobiilin pystyasennossa. */
@media (orientation:portrait) and (max-width:800px){
  #deathJosses{
    width:190px!important;
    height:68px!important;
    border-width:4px!important;
    border-radius:17px!important;
    font-size:24px!important;
    box-shadow:0 6px 0 #4b1d15!important;
  }
}
</style>

<style id="v30-real-mobile-fix">
#touch{display:none!important;visibility:hidden!important;pointer-events:none!important;}

/* Pienennetään JÖSSES stage-koordinaateissa, jolloin myös Wix-skaalauksen
   jälkeen se pysyy mobiilissa maltillisena. */
@media (orientation:portrait), (max-width:700px){
  #deathJosses{
    width:150px!important;
    height:54px!important;
    min-width:0!important;
    min-height:0!important;
    padding:0!important;
    border-width:3px!important;
    border-radius:13px!important;
    font:900 19px/1 Arial,sans-serif!important;
    box-shadow:0 4px 0 #4b1d15!important;
  }
}
</style>

<style id="v31-cookie-counter-clean">
#hud{
  background:transparent!important;
  box-shadow:none!important;
  border:none!important;
}
</style>

<style id="v32-landscape-fit">
@media (orientation: landscape) and (max-height: 600px) and (pointer: coarse){
  html,body{
    margin:0!important;
    padding:0!important;
    width:100%!important;
    height:100%!important;
    min-height:0!important;
    overflow:hidden!important;
    background:transparent!important;
  }
  body{
    display:flex!important;
    align-items:flex-start!important;
    justify-content:center!important;
  }
  #stage{
    position:absolute!important;
    left:50%!important;
    top:0!important;
    transform-origin:top center!important;
    margin:0!important;
  }
}
</style>

function drawEnemy(e){let X=e.x-cam,Y=e.y,t=frame*.09;
/* Referenssin hengessä pullea, vaaleanvihreä lonkero-otus. Ei suuta. */

/* neljä paksua, elävää lonkerojalkaa */

/* peitetään alareunan ääriviiva samalla vihreällä, jotta vartalo sulautuu lonkeroihin */
x.fillStyle='#72d565';x.fillRect(X+2,Y+21,34,9);
x.fillStyle='#a9e99d';x.beginPath();x.ellipse(X+13,Y+9,9,6,-.35,0,Math.PI*2);x.fill();

/* silmät katsovat oikeasti pelaajan keskikohtaa kohti */
const pcx=p.x+p.w/2, pcy=p.y+p.h/2;

let dx=pcx-ecx,dy=pcy-ecy,len=Math.hypot(dx,dy)||1;
dx/=len;dy/=len;
for(const ex of [X+11.5,X+26.5]){
 const ey=Y+13;
 x.fillStyle='#183d21';x.beginPath();x.arc(ex,ey,8.2,0,Math.PI*2);x.fill();

 const px=ex+dx*2.7,py=ey+dy*2.7;

}
x.restore();
}
function drawPlayer(){
 let X=p.x-cam,Y=p.y;
 const TARGET_H=230;
 if(selectedCharacter==='JOHANNES'){
   const moving=Math.abs(p.vx)>.15&&p.ground;
   const step=moving?Math.sin(frame*.45):0;
   const ratio=johannesImg.naturalWidth&&johannesImg.naturalHeight?johannesImg.naturalWidth/johannesImg.naturalHeight:.42;
   const dw=TARGET_H*ratio,dh=TARGET_H;
   x.save();x.translate(X+p.w/2,Y+p.h/2);
   if(p.face<0)x.scale(-1,1);
   if(moving)x.rotate(step*.018);
   x.drawImage(johannesImg,-dw/2,-dh/2+(moving?Math.abs(step)*1.2:0),dw,dh);
   x.restore();return;
 }
 let img=Math.abs(p.vx)<.3?sprites.idle:[sprites.walk1,sprites.walk2,sprites.walk3][Math.floor(frame/8)%3];
 if(!img||!img.width)return;
 const dw=TARGET_H*(img.width/img.height),dh=TARGET_H;
 x.save();
 if(p.face<0){x.translate(X+p.w/2,0);x.scale(-1,1);x.drawImage(img,-dw/2,Y+(p.h-dh),dw,dh)}
 else{x.drawImage(img,X+(p.w-dw)/2,Y+(p.h-dh),dw,dh)}
 x.restore();
}

<script id="v32-landscape-fit-js">
(function(){
  function fitLandscape(){
    const stage=document.getElementById('stage');
    if(!stage) return;

    const landscape=window.matchMedia('(orientation: landscape)').matches;
    const coarse=window.matchMedia('(pointer: coarse)').matches;
    const shortScreen=(window.visualViewport ? window.visualViewport.height : window.innerHeight) <= 600;

    if(landscape && coarse && shortScreen){
      const vw=window.visualViewport ? window.visualViewport.width : window.innerWidth;
      const vh=window.visualViewport ? window.visualViewport.height : window.innerHeight;
      const scale=Math.min(vw/960, vh/720);
      stage.style.transform='translateX(-50%) scale('+scale+')';
      document.documentElement.style.height=vh+'px';
      document.body.style.height=vh+'px';
    }else{
      stage.style.transform='';
      document.documentElement.style.height='';
      document.body.style.height='';
    }
  }

  window.addEventListener('resize',fitLandscape,{passive:true});
  window.addEventListener('orientationchange',function(){setTimeout(fitLandscape,120)},{passive:true});
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',fitLandscape,{passive:true});
  }
  window.addEventListener('load',fitLandscape);
  setTimeout(fitLandscape,100);
})();
</script>
